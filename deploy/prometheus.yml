global:
  scrape_interval: 5s

scrape_configs:
  - job_name: aiosight
    static_configs:
      - targets: ["aiosight-1:8080"]
        labels:
          instance: "1"
      - targets: ["aiosight-2:8080"]
        labels:
          instance: "2"
      - targets: ["aiosight-3:8080"]
        labels:
          instance: "3"

  - job_name: aiosight-router
    static_configs:
      - targets: ["router:8081"]
