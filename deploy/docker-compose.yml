services:
  # 三个无共享状态的实例，各自持有一部分指标分片
  aiosight-1: &aiosight
    image: ghcr.io/ooo099/tencent-aiops:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment: &env
      AIOSIGHT_INSTANCE_ID: "1"
      AIOSIGHT_RATE_LIMIT: "100000"
      AIOSIGHT_RATE_BURST: "100000"
      AIOSIGHT_DEMO: "1"
      # 接入真实大模型时打开（任意 OpenAI 兼容接口）
      # AIOSIGHT_LLM_ENDPOINT: "https://open.bigmodel.cn/api/paas/v4/chat/completions"
      # AIOSIGHT_LLM_API_KEY: "your-key"
      # AIOSIGHT_LLM_MODEL: "glm-4-flash"
    restart: unless-stopped

  aiosight-2:
    <<: *aiosight
    environment:
      <<: *env
      AIOSIGHT_INSTANCE_ID: "2"

  aiosight-3:
    <<: *aiosight
    environment:
      <<: *env
      AIOSIGHT_INSTANCE_ID: "3"

  # 分片网关：按指标名做一致性哈希，保证同一指标落到同一实例
  router:
    image: ghcr.io/ooo099/tencent-aiops:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/router"]
    command: ["-addr=:8081", "-backends=http://aiosight-1:8080,http://aiosight-2:8080,http://aiosight-3:8080"]
    ports:
      - "8081:8081"
    depends_on:
      - aiosight-1
      - aiosight-2
      - aiosight-3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - aiosight-1
      - aiosight-2
      - aiosight-3

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
