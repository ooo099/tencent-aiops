apiVersion: v1
kind: Namespace
metadata:
  name: aiosight
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiosight-config
  namespace: aiosight
data:
  AIOSIGHT_HTTP_ADDR: ":8080"
  AIOSIGHT_TCP_ADDR: ":9000"
  AIOSIGHT_UDP_ADDR: ":9001"
  AIOSIGHT_RATE_LIMIT: "100000"
  AIOSIGHT_RATE_BURST: "100000"
  AIOSIGHT_DEMO: "1"
---
# 有状态分片：每个 Pod 固定名字，router 通过 headless Service 的稳定 DNS 寻址
apiVersion: v1
kind: Service
metadata:
  name: aiosight-headless
  namespace: aiosight
spec:
  clusterIP: None
  selector:
    app: aiosight
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aiosight
  namespace: aiosight
spec:
  serviceName: aiosight-headless
  replicas: 3
  selector:
    matchLabels:
      app: aiosight
  template:
    metadata:
      labels:
        app: aiosight
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: aiosight
          image: ghcr.io/ooo099/tencent-aiops:latest
          imagePullPolicy: IfNotPresent
          args: ["-addr=:8080"]
          envFrom:
            - configMapRef:
                name: aiosight-config
          env:
            - name: AIOSIGHT_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8080
            - name: metrics-tcp
              containerPort: 9000
            - name: metrics-udp
              containerPort: 9001
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aiosight-pdb
  namespace: aiosight
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: aiosight
---
# 分片网关：无状态，可自由扩缩容
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiosight-router
  namespace: aiosight
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiosight-router
  template:
    metadata:
      labels:
        app: aiosight-router
    spec:
      containers:
        - name: router
          image: ghcr.io/ooo099/tencent-aiops:latest
          imagePullPolicy: IfNotPresent
          command: ["/router"]
          args:
            - "-addr=:8081"
            - "-backends=http://aiosight-0.aiosight-headless:8080,http://aiosight-1.aiosight-headless:8080,http://aiosight-2.aiosight-headless:8080"
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aiosight-router
  namespace: aiosight
spec:
  type: NodePort
  selector:
    app: aiosight-router
  ports:
    - name: http
      port: 80
      targetPort: 8081
      nodePort: 30081
---
# 只对无状态的 router 做 HPA；分片实例的扩缩容需要配合一致性哈希迁移
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aiosight-router
  namespace: aiosight
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aiosight-router
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
