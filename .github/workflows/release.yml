name: Release

# 打 tag（如 v0.1.0）时自动构建并推送到 Docker Hub，
# 需要在仓库 Secrets 里配置 DOCKERHUB_USERNAME 和 DOCKERHUB_TOKEN。
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: test before release
        run: go test ./...

      - name: build cross-platform binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o dist/aiosight-$os-$arch ./cmd/aiosight
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o dist/router-$os-$arch ./cmd/router
          done

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aiosight:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/aiosight:latest

      - name: upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
