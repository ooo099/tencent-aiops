name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then
            echo "以下文件未格式化："
            echo "$fmt"
            exit 1
          fi

      - name: unit tests (race + coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: build binaries
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/aiosight ./cmd/aiosight
          CGO_ENABLED=0 go build -trimpath -o bin/router ./cmd/router

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -f deploy/Dockerfile -t aiosight:ci .
